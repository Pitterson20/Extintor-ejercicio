<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./src/index.css" />
   <script src="./src/index.js" defer></script>
    <title>Señal de extintor</title>
</head>
<body>
    <main class="page">
        <article class="sign" aria-label="Señal de extintor para fuego clase A">
            <h1>EXTINTOR</h1>
            <p class="subtitle">USELO UNICAMENTE EN FUEGO CLASE</p>

            <div class="class-mark" aria-label="Clase A">
                <svg viewBox="0 0 100 78" aria-hidden="true">
                    <path d="M50 2 98 76H2L50 2Z" />
                </svg>
                <span>A</span>
            </div>

            <button class="fire-icon" type="button" aria-label="Pasa el cursor para escuchar el sonido del fuego" title="Pasa el cursor para escuchar el sonido del fuego">
                <svg viewBox="0 0 100 82" role="img" aria-hidden="true">
                    <rect x="1" y="1" width="98" height="80" rx="13" />
                    <path class="white" d="M20 25h24l-2 39H22l-2-39Zm4-6h16l3 5H21l3-5Zm3 0c0-4 3-7 6-7s6 3 6 7" />
                    <path class="white" d="M65 17c2 8-7 11-4 19 2-3 5-4 7-8 9 8 12 16 8 23-3 6-10 9-17 6-9-4-10-13-5-21 4-6 9-10 11-19Z" />
                    <path class="white" d="M49 64c5-5 9-7 13-5 3 1 5 4 8 5 4 1 7-1 11-3l-2 7c-5 4-11 4-16 1-4-2-7-2-12 1l-2-6Zm13-3 3 4m7-3 3 4m-16 1 3 4" />
                    <circle class="spark" cx="54" cy="53" r="2" />
                    <circle class="spark" cx="79" cy="53" r="2" />
                </svg>
            </button>

            <p class="category">SOLIDOS COMBUSTIBLES</p>
            <p class="materials">madera, papel,<br>tela, basura<br>cartones</p>

            <section class="instructions" aria-labelledby="instructions-title">
                <h2 id="instructions-title">METODO PARA UTILIZARLO</h2>
                <ol>
                    <li>Sosténgalo en posición vertical.</li>
                    <li>Retire el seguro.</li>
                    <li>Oprima la palanca.</li>
                    <li>Dirija la descarga contra la base de la llama.</li>
                </ol>
            </section>

            <div class="warning-stripes" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </article>
    </main>
</body>
</html>
